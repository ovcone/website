name: Build and deploy Zola website
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # Fine-grained token: Contents read on website, ovcozola and ovcomponents.
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Generate JXL, AVIF, and JPEG images
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install --yes libjxl-tools libavif-bin imagemagick

          mapfile -d '' -t sources < <(
            find content -type f \
              \( -iname '*.png' \
                 -o -iname '*.jpg' \
                 -o -iname '*.jpeg' \
                 -o -iname '*.webp' \) \
              -print0
          )

          for src in "${sources[@]}"; do
            (
              stem="${src%.*}"
              jxl="${stem}.jxl"
              avif="${stem}.avif"
              jpg="${stem}.jpg"

              for out in "$jxl" "$avif" "$jpg"; do
                if [[ "$out" != "$src" && ( -e "$out" || -L "$out" ) ]]; then
                  printf 'Refusing to overwrite: %s\n' "$out" >&2
                  exit 1
                fi
              done

              work=$(mktemp -d "${src%/*}/.convert.XXXXXX")
              trap 'rm -rf -- "$work"' EXIT

              printf 'Converting: %s\n' "$src"

              input="$src"
              ext="${src##*.}"

              if [[ "${ext,,}" == webp ]]; then
                "magick" "${src}[0]" "$work/input.png"
                input="$work/input.png"
              fi

              cjxl \
                --progressive \
                --quality 95 \
                --lossless_jpeg=0 \
                --effort 7 \
                --num_threads=-1 \
                "$input" "$work/output.jxl"

              avifenc \
                --progressive \
                --qcolor 95 \
                --qalpha 100 \
                --yuv 444 \
                --speed 4 \
                --jobs all \
                "$input" "$work/output.avif"

              case "${ext,,}" in
                jpg|jpeg)
                  cp -- "$src" "$work/output.jpg"
                  ;;
                *)
                  "magick" "$input" -quality 100 "jpeg:$work/output.jpg"
                  ;;
              esac

              mv -- "$work/output.jxl" "$jxl"
              mv -- "$work/output.avif" "$avif"
              mv -- "$work/output.jpg" "$jpg"

              if [[ "$src" != "$jpg" ]]; then
                rm -- "$src"
              fi
            )
          done


      - name: Build Zola + upload Pages artifact
        uses: getzola/github-pages@435a833fd3f1edcb28d70576c89e30a6365cd8f7 # v1
        with:
          zola_version: v0.23.6

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
