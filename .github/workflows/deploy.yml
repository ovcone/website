name: Build and deploy Zola website
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate JXL and AVIF images
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install --yes libjxl-tools libavif-bin

          find static -type f -iname '*.png' -print0 |
          while IFS= read -r -d '' png; do
            stem="${png%.*}"
            jxl="${stem}.jxl"
            avif="${stem}.avif"

            tmp_jxl="${jxl}.tmp"
            tmp_avif="${avif}.tmp"

            echo "Converting: $png"

            cjxl \
              --progressive \
              --quality 95 \
              --alpha_distance=0 \
              --effort 7 \
              --num_threads=-1 \
              "$png" "$tmp_jxl"

            avifenc \
              --progressive \
              --qcolor 95 \
              --qalpha 100 \
              --yuv 444 \
              --speed 4 \
              --jobs all \
              "$png" "$tmp_avif"

            mv -- "$tmp_jxl" "$jxl"
            mv -- "$tmp_avif" "$avif"
            rm -- "$png"
          done

      - name: Build Zola + upload Pages artifact
        uses: getzola/github-pages@435a833fd3f1edcb28d70576c89e30a6365cd8f7 # v1
        with:
          zola_version: v0.23.6

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
